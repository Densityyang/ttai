      - severe_weak_light
      - kpi
    time_grain: day
    rollup_strategy: null
    dimensions: []
    value_type: percent
    unit: '%'
    expression: |
      ROUND((CAST({severe_weak_light} AS DECIMAL) / {weak_light}) * 100, 2)
    dependencies:
      severe_weak_light: home_broadband_severe_weak_light_count_day
      weak_light: home_broadband_weak_light_count_day

