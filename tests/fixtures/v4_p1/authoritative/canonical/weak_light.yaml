  # ============ 新装弱光指标（日粒度，支持按日期范围累计）============
  - name: post_installation_weak_light_count_area_day
    display_name: 新装弱光数（区县-日）
    description: 感知系统新装弱光明细中，按归档时间统计的区县日度新装弱光数量
    source_type: raw
    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - weak_light
      - post_installation
      - area
    time_grain: day
    time_column: archive_time
    rollup_strategy: sum
    dimensions:
      - name: area_id
        type: area
    value_type: count
    unit: 单
    source_table: silver_post_installation_weak_light
    aggregation:
      operation: count
      column: id
    filters:
      - column: archive_time
        operator: not_null

  - name: post_installation_archived_order_count_area_day
    display_name: 新装弱光分母归档工单数（区县-日）
    description: 施工调度系统当月全量归档工单的区县日度数量，用于新装弱光占比分母
    source_type: raw
    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - weak_light
      - post_installation
      - denominator
      - area
    time_grain: day
    time_column: archive_time
    rollup_strategy: sum
    dimensions:
      - name: area_id
        type: area
    value_type: count
    unit: 单
    source_table: silver_installation_work_order
    aggregation:
      operation: count
      column: id
    filters:
      - column: archive_time
        operator: not_null

  - name: post_installation_weak_light_rate_area_day
    display_name: 新装弱光（区县-日）
    description: 感知系统新装弱光明细数 / 施工调度系统全量归档工单数，支持选择当月1日至前天做累计
    source_type: derived
    calculation_type: expression
    domain: maintenance
    owner: maintenance_dept
    tags:
      - weak_light
      - post_installation
      - kpi
      - area
    time_grain: day
    rollup_strategy: null
    dimensions:
      - name: area_id
        type: area
    value_type: percent
    unit: '%'
    expression: |
      CASE
        WHEN CAST({archived_orders} AS DECIMAL) > 0
        THEN ROUND((CAST(COALESCE({weak_light}, 0) AS DECIMAL) / {archived_orders}) * 100, 2)
        ELSE NULL
      END
    dependencies:
      weak_light: post_installation_weak_light_count_area_day
      archived_orders: post_installation_archived_order_count_area_day

