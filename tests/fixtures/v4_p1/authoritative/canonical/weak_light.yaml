    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - consumer
      - home_broadband
      - customer_count
      - area
    time_grain: day
    time_column: stat_date
    rollup_strategy: last
    dimensions:
      - name: area_id
        type: area
    value_type: integer
    unit: 户
    source_table: consumer_home_broadband_customer_count_snapshot
    aggregation:
      operation: sum
      column: customer_count
    filters:
      - column: dimension_type
        operator: eq
        value: area

