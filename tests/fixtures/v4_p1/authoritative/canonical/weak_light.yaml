# WEAK_LIGHT 业务域指标配置
metrics:
  - name: home_broadband_weak_light_count_day
    display_name: 全量弱光数（日）
    description: 家宽运维系统弱光 ONU 统计报表中，昨日业务类型为家宽且光功率不达标类型为弱光/重度弱光的 ONU 数量
    source_type: raw
    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - weak_light
      - home_broadband
      - onu
    time_grain: day
    time_column: collection_time
    rollup_strategy: sum
    dimensions: []
    value_type: count
    unit: 户
    source_table: silver_weak_light_onu_statistics
    aggregation:
      operation: count
      column: id
    filters:
      - column: service_type
        operator: eq
        value: 家宽
      - column: light_power_noncompliance_type
        operator: in
        value: [弱光, 重度弱光]

  - name: home_broadband_severe_weak_light_count_day
    display_name: 重度弱光数（日）
    description: 家宽运维系统弱光 ONU 统计报表中，昨日业务类型为家宽且光功率不达标类型为重度弱光的 ONU 数量
    source_type: raw
    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - weak_light
      - severe_weak_light
      - home_broadband
      - onu
    time_grain: day
    time_column: collection_time
    rollup_strategy: sum
    dimensions: []
    value_type: count
    unit: 户
    source_table: silver_weak_light_onu_statistics
    aggregation:
      operation: count
      column: id
    filters:
      - column: service_type
        operator: eq
        value: 家宽
      - column: light_power_noncompliance_type
        operator: eq
        value: 重度弱光

  - name: enterprise_broadband_weak_light_count_day
    display_name: 企宽弱光数（日）
    description: 感知系统弱光 ONU 统计报表中，昨日业务类型为企宽的 ONU 弱光数量
    source_type: raw
    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - weak_light
      - enterprise_broadband
      - onu
    time_grain: day
    time_column: collection_time
    rollup_strategy: sum
    dimensions: []
    value_type: count
    unit: 户
    source_table: silver_weak_light_onu_statistics
    aggregation:
      operation: count
      column: id
    filters:
      - column: service_type
        operator: eq
        value: 企宽
      - column: light_power_noncompliance_type
        operator: in
        value: [弱光, 重度弱光]

  - name: home_broadband_weak_light_rate_day
    display_name: 当月光功率不达标占比（日）
    description: 全量弱光数 / 家宽客户数，按弱光 ONU 统计报表昨日快照计算
    source_type: derived
    calculation_type: expression
    domain: maintenance
    owner: maintenance_dept
    tags:
      - weak_light
      - home_broadband
      - kpi
    time_grain: day
    rollup_strategy: null
    dimensions: []
    value_type: percent
    unit: '%'
    expression: |
      ROUND((CAST({weak_light} AS DECIMAL) / {customer_count}) * 100, 2)
    dependencies:
      weak_light: home_broadband_weak_light_count_day
      customer_count: home_broadband_customer_count

  - name: home_broadband_severe_weak_light_rate_day
    display_name: 当月重度弱光占比（日）
    description: 重度弱光数 / 全量弱光数，按弱光 ONU 统计报表昨日快照计算
    source_type: derived
    calculation_type: expression
