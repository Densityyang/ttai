# COMPLAINT 业务域指标配置
metrics:
  # ============ 无维度指标（日粒度）============
  - name: complaint_total_valid_bandwidth_count_day
    display_name: 投诉有效带宽工单总数（日）
    description: 投诉工单日度总数（无维度，带宽有效）
    source_type: raw
    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - complaint
    time_grain: day
    time_column: first_arrival_time
    rollup_strategy: sum
    dimensions: []
    value_type: count
    unit: 单
    source_table: silver_fault_reporting_order
    aggregation:
      operation: count
      column: id
    filters:
      - column: has_valid_bandwidth
        operator: eq
        value: true

  - name: complaint_in_transit_count_day
    display_name: 投诉在途工单数（日）
    description: 投诉工单日度在途数量（无维度，竣工时间为空、带宽有效）
    source_type: raw
    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - complaint
      - 在途
    time_grain: day
    time_column: acceptance_time
    rollup_strategy: sum
    dimensions: []
    value_type: count
    unit: 单
    source_table: silver_fault_reporting_order
    aggregation:
      operation: count
      column: id
    filters:
      - column: has_valid_bandwidth
        operator: eq
        value: true
      - column: completion_time
        operator: is_null

