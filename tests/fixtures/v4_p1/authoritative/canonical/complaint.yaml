    rollup_strategy: sum
    dimensions: []
    value_type: count
    unit: 单
    source_table: silver_fault_reporting_order
    aggregation:
      operation: count
      column: id
    filters:
      - column: has_valid_bandwidth
        operator: eq
        value: true
      - column: completion_time
        operator: not_null

