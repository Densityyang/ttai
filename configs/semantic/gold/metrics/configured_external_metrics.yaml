# 达标标准可按指标配置：threshold: {target: 95, operator: gte}。
# 未配置 threshold 的指标不参与达标判断；百分比标准使用 0-100 口径（95 即 95%）。
metrics:
  - &h5_satisfaction_notice
    name: h5_install_satisfaction_performance_value_month
    display_name: 装机满意度表现值（月）
    description: 从 H5 满意度通报直接导入，不由测评明细计算
    source_type: external
    calculation_type: imported
    domain: maintenance
    tags: [h5, satisfaction, external]
    time_grain: month
    rollup_strategy: null
    dimensions:
      - {name: area_id, type: area}
      - {name: category_code, type: category, required: true}
    value_type: score
    unit: 分
  - <<: *h5_satisfaction_notice
    name: h5_fault_satisfaction_performance_value_month
    display_name: 故障/投诉满意度表现值（月）
  - <<: *h5_satisfaction_notice
    name: h5_overall_satisfaction_performance_value_month
    display_name: 整体满意度表现值（月）
  - <<: *h5_satisfaction_notice
    name: h5_satisfaction_participation_rate_month
    display_name: H5满意度参评率（月）
    value_type: percentage
    unit: '%'
