  # ============ KPI 指标 - 全局维度 ============
  - name: repair_service_archive_rate_overall_day
    display_name: 报修服务归档及时率（全局-日）
    description: 报修服务工单归档及时率（全局维度，日粒度）
    source_type: derived
    calculation_type: expression
    domain: maintenance
    owner: maintenance_dept
    tags: [repair_service, 时效, kpi, overall]
    time_grain: day
    dimensions: []
    value_type: percent
    unit: "%"
    expression: |
      CASE
        WHEN {total} > 0
        THEN ROUND((CAST(COALESCE({on_time}, 0) AS DECIMAL) / {total}) * 100, 2)
        ELSE NULL
      END
    dependencies:
      on_time: repair_service_archive_on_time_count_overall_day
      total: repair_service_calc_total_count_overall_day

  - name: repair_service_order_ratio_overall_day
    display_name: 报修服务工单占比（全局-日）
    description: 报修服务工单数占全部报修+投诉工单数的比例（全局维度，日粒度）
    source_type: derived
    calculation_type: expression
    domain: maintenance
    owner: maintenance_dept
    tags: [repair_service, kpi, overall]
    time_grain: day
    dimensions: []
    value_type: percent
    unit: "%"
    expression: |
      CASE
        WHEN {repair} IS NULL OR {fault} IS NULL
        THEN NULL
        WHEN (CAST({repair} AS DECIMAL) + CAST({fault} AS DECIMAL)) > 0
        THEN ROUND((CAST({repair} AS DECIMAL) / (CAST({repair} AS DECIMAL) + CAST({fault} AS DECIMAL))) * 100, 2)
        ELSE NULL
      END
    dependencies:
      repair: repair_service_calc_total_count_overall_day
      fault: fault_reporting_calc_total_count_overall_day

