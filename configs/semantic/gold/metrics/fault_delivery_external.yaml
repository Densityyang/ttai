# 外部故障交付分析系统已计算的月度百分比，禁止在本系统内再次汇总。
metrics:
  - name: fault_delivery_compliance_rate_month
    display_name: 故障交付达标率（月）
    description: 外部导入的故障交付达标率月度权威值
    source_type: external
    calculation_type: imported
    domain: maintenance
    tags: [fault_delivery, external]
    time_grain: month
    rollup_strategy: null
    dimensions: &fault_delivery_dimensions
      - {name: area_id, type: area}
      - {name: team_id, type: team}
      - {name: employee_id, type: employee}
      - {name: category_code, type: category, required: true}
    value_type: percent
    unit: '%'

  - name: timely_first_response_rate_month
    display_name: 及时首响占比（月）
