  # ============ KPI 指标 - 区县维度 ============
  - name: single_fault_first_response_rate_area_day
    display_name: 单障首响及时率（区县-日）
    description: 单障工单首响及时率（区县维度，日粒度）
    source_type: derived
    calculation_type: expression
    domain: maintenance
    owner: maintenance_dept
    tags:
      - single_fault
      - 时效
      - kpi
    time_grain: day
    dimensions:
      - name: area_id
        type: area
    value_type: percent
    unit: "%"
    expression: |
      CASE
        WHEN {total} > 0
        THEN ROUND((CAST(COALESCE({on_time}, 0) AS DECIMAL) / {total}) * 100, 2)
        ELSE NULL
      END
    dependencies:
      on_time: single_fault_first_response_on_time_count_area_day
      total: single_fault_calc_total_count_area_day

