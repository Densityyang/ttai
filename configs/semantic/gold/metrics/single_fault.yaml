# SINGLE_FAULT 业务域指标配置
metrics:
  # ============ 无维度指标（日粒度）============
  - name: single_fault_total_count_day
    display_name: 单障工单总数（日）
    description: 单障工单日度总数（无维度）
    source_type: raw
    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - single_fault
    time_grain: day
    time_column: order_acceptance_time
    rollup_strategy: sum
    dimensions: []
    value_type: count
    unit: 单
    source_table: silver_single_faulty_order
    aggregation:
      operation: count
      column: id

  - name: single_fault_in_transit_count_day
