    time_grain: day
    time_column: acceptance_time
    rollup_strategy: sum
    dimensions: []
    value_type: count
    unit: 单
    source_table: silver_installation_work_order
    aggregation:
      operation: count
      column: id
    filters:
      - column: archive_time
        operator: is_null

