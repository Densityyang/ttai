# INSTALLATION 业务域指标配置
metrics:
  # ============ 无维度指标（日粒度）============
  - name: installation_total_count_day
    display_name: 装机工单总数（日）
    description: 装机工单日度总数（无维度，剔除短流程）
    source_type: raw
    calculation_type: aggregation
    domain: maintenance
    owner: maintenance_dept
    tags:
      - 装机
    time_grain: day
    time_column: archive_time
    rollup_strategy: sum
    dimensions: []
    value_type: count
    unit: 单
    source_table: silver_installation_work_order
    aggregation:
      operation: count
      column: id
    filters:
      - column: is_short_process
        operator: eq
        value: false

  - name: installation_in_transit_count_day
    display_name: 装机在途工单数（日）
