[project]
name = "nl2sql"
version = "0.1.0"
description = "NL2SQL service with layered architecture"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.31.0",
    "faiss-cpu>=1.7.0",
    "fastapi>=0.128.7",
    "greenlet>=3.3.1",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "langchain-core>=1.3.3",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-postgres>=3.1.1",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.14",
    "langfuse>=2.0.0",
    "langserve>=0.3.3",
    "prompt-toolkit>=3.0.52",
    "psycopg[binary]>=3.3.2",
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.46",
    "sqlglot>=26.0.0",
    "sqlparse>=0.5.0",
    "sse-starlette>=3.2.0",
    "structlog>=25.5.0",
    "typer>=0.15.0",
    "uvicorn>=0.40.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pip>=26.1.2",
    "paramiko>=3.0.0",
    "pip-audit>=2.9.0",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Start with correctness and deterministic imports. Existing long prose and
# prompt strings are intentionally handled by a later formatting pass.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["postgres_integration: isolated Docker PostgreSQL contract tests"]
