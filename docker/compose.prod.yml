x-product-api: &product-api
  environment:
    SERVICE_MODE: product
    MODEL_REQUIRED: "true"
    MEMORY_BACKEND: postgresql
    AUTH_ENABLED: "true"
    TT_API_BASE_URL: ${TT_API_BASE_URL:?TT_API_BASE_URL must be set for product}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set for product}
    CODEACT_MODE: disabled
    ENABLE_DYNAMIC_CALC: "false"
    DATABASE_URL_FILE: /run/secrets/business_ro_database_url
    CONTROL_DATABASE_URL_FILE: /run/secrets/control_app_database_url
    CHECKPOINT_DATABASE_URL_FILE: /run/secrets/checkpoint_app_database_url
    DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    NVIDIA_API_KEY_FILE: /run/secrets/nvidia_nim_api_key
    EMBEDDING_API_KEY_FILE: /run/secrets/embedding_api_key
  secrets:
    - business_ro_database_url
    - control_app_database_url
    - checkpoint_app_database_url
    - deepseek_api_key
    - nvidia_nim_api_key
    - embedding_api_key
  networks:
    edge_net:
    control_net:
    business_external_net:
    egress_net:

services:
  api-a:
    <<: *product-api
  api-b:
    <<: *product-api

networks:
  business_external_net:
    external: true
    name: ${BUSINESS_EXTERNAL_NETWORK:-business_external_net}

secrets:
  business_ro_database_url:
    file: ../secrets/database/business_ro_database_url
  control_app_database_url:
    file: ../secrets/database/control_app_database_url
  checkpoint_app_database_url:
    file: ../secrets/database/checkpoint_app_database_url
  deepseek_api_key:
    file: ../secrets/providers/deepseek_api_key
  nvidia_nim_api_key:
    file: ../secrets/providers/nvidia_nim_api_key
  embedding_api_key:
    file: ../secrets/providers/embedding_api_key
