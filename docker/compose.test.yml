services:
  api-a:
    environment:
      SERVICE_MODE: infra-dev
      MODEL_REQUIRED: "false"
      AUTH_ENABLED: "false"
      LANGFUSE_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://testserver
  api-b:
    environment:
      SERVICE_MODE: infra-dev
      MODEL_REQUIRED: "false"
      AUTH_ENABLED: "false"
      LANGFUSE_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://testserver

  control-postgres:
    environment:
      POSTGRES_DB: ttai_control_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U control_owner -d ttai_control_test"]
  checkpoint-postgres:
    environment:
      POSTGRES_DB: ttai_checkpoint_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U checkpoint_owner -d ttai_checkpoint_test"]
  business-postgres:
    environment:
      POSTGRES_DB: ttai_business_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U business_owner -d ttai_business_test"]

volumes:
  control_pgdata:
    name: tt_ai_test_control_pgdata
  checkpoint_pgdata:
    name: tt_ai_test_checkpoint_pgdata
  business_pgdata:
    name: tt_ai_test_business_pgdata
  database_backups:
    name: tt_ai_test_database_backups
