services:
  api-a:
    environment:
      SERVICE_MODE: infra-dev
      MODEL_REQUIRED: "false"
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ../src:/app/src:ro
      - ../configs:/app/configs:ro
    networks:
      edge_net:
      control_net:
      data_net:
      egress_net:
  api-b:
    environment:
      SERVICE_MODE: infra-dev
      MODEL_REQUIRED: "false"
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ../src:/app/src:ro
      - ../configs:/app/configs:ro
    networks:
      edge_net:
      control_net:
      data_net:
      egress_net:

  control-postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ttai_control
      POSTGRES_USER: control_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/control_owner_password
      DB_APP_ROLE: control_app
      DB_APP_PASSWORD_FILE: /run/secrets/control_app_password
      DB_APP_PRIVILEGES: readwrite
      DB_MIGRATOR_ROLE: control_migrator
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/control_migrator_password
      DB_BACKUP_ROLE: control_backup
      DB_BACKUP_PASSWORD_FILE: /run/secrets/control_backup_password
      DB_REQUIRED_EXTENSIONS: "vector pg_trgm"
      DB_RESTORE_TEST_DATABASE: ttai_control_restore_test
      DB_RESTORE_ROLE: control_migrator
    volumes:
      - control_pgdata:/var/lib/postgresql/data
      - ./initdb/roles.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
    secrets:
      - control_owner_password
      - control_app_password
      - control_migrator_password
      - control_backup_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_owner -d ttai_control"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      control_net:

  checkpoint-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ttai_checkpoint
      POSTGRES_USER: checkpoint_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/checkpoint_owner_password
      DB_APP_ROLE: checkpoint_app
      DB_APP_PASSWORD_FILE: /run/secrets/checkpoint_app_password
      DB_APP_PRIVILEGES: readwrite
      DB_MIGRATOR_ROLE: checkpoint_migrator
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/checkpoint_migrator_password
      DB_BACKUP_ROLE: checkpoint_backup
      DB_BACKUP_PASSWORD_FILE: /run/secrets/checkpoint_backup_password
      DB_RESTORE_TEST_DATABASE: ttai_checkpoint_restore_test
      DB_RESTORE_ROLE: checkpoint_migrator
    volumes:
      - checkpoint_pgdata:/var/lib/postgresql/data
      - ./initdb/roles.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
    secrets:
      - checkpoint_owner_password
      - checkpoint_app_password
      - checkpoint_migrator_password
      - checkpoint_backup_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkpoint_owner -d ttai_checkpoint"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      control_net:

  business-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ttai_business
      POSTGRES_USER: business_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/business_owner_password
      DB_APP_ROLE: business_reader
      DB_APP_PASSWORD_FILE: /run/secrets/business_reader_password
      DB_APP_PRIVILEGES: readonly
      DB_OBJECT_OWNER_ROLE: business_owner
    volumes:
      - business_pgdata:/var/lib/postgresql/data
      - ./initdb/roles.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
    secrets:
      - business_owner_password
      - business_reader_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_owner -d ttai_business"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      data_net:

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["ops"]
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    depends_on:
      control-postgres:
        condition: service_healthy
      checkpoint-postgres:
        condition: service_healthy
    environment:
      CONTROL_MIGRATOR_DATABASE_URL_FILE: /run/secrets/control_migrator_database_url
      CHECKPOINT_MIGRATOR_DATABASE_URL_FILE: /run/secrets/checkpoint_migrator_database_url
      CHECKPOINT_SNAPSHOT_REQUIRED: ${CHECKPOINT_SNAPSHOT_REQUIRED:-false}
      CHECKPOINT_SNAPSHOT_FILE: /backups/checkpoint/latest.dump
    entrypoint: ["/app/docker/scripts/migrate.sh"]
    command: ["--phase", "expand"]
    volumes:
      - database_backups:/backups:ro
    secrets:
      - control_migrator_database_url
      - checkpoint_migrator_database_url
    networks:
      control_net:

  indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["ops"]
    depends_on:
      control-postgres:
        condition: service_healthy
    environment:
      CONTROL_DATABASE_URL_FILE: /run/secrets/control_app_database_url
    command: ["python", "-m", "src.nl2sql.semantic.indexer"]
    volumes:
      - ../configs:/app/configs:ro
    secrets:
      - control_app_database_url
    networks:
      control_net:
      egress_net:

  benchmark:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["benchmark"]
    depends_on:
      control-postgres:
        condition: service_healthy
      business-postgres:
        condition: service_healthy
    environment:
      CONTROL_DATABASE_URL_FILE: /run/secrets/control_app_database_url
      BENCHMARK_MAX_CONCURRENCY: ${BENCHMARK_MAX_CONCURRENCY:-4}
      BENCHMARK_MAX_COST: ${BENCHMARK_MAX_COST:-1.00}
    command: ["python", "-m", "benchmarks.runner", "--dataset", "enterprise", "--stub"]
    volumes:
      - ../benchmarks/results:/app/benchmarks/results
    secrets:
      - control_app_database_url
    networks:
      control_net:
      data_net:
      egress_net:

  backup:
    image: postgres:17-alpine
    profiles: ["ops"]
    depends_on:
      control-postgres:
        condition: service_healthy
      checkpoint-postgres:
        condition: service_healthy
    environment:
      CONTROL_BACKUP_DATABASE_URL_FILE: /run/secrets/control_backup_database_url
      CHECKPOINT_BACKUP_DATABASE_URL_FILE: /run/secrets/checkpoint_backup_database_url
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    command: ["/bin/sh", "/scripts/backup.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - database_backups:/backups
    secrets:
      - control_backup_database_url
      - checkpoint_backup_database_url
    networks:
      control_net:

  restore-test:
    image: postgres:17-alpine
    profiles: ["ops"]
    depends_on:
      control-postgres:
        condition: service_healthy
      checkpoint-postgres:
        condition: service_healthy
    environment:
      CONTROL_RESTORE_DATABASE_URL_FILE: /run/secrets/control_restore_database_url
      CHECKPOINT_RESTORE_DATABASE_URL_FILE: /run/secrets/checkpoint_restore_database_url
      BACKUP_DIR: /backups
    command: ["/bin/sh", "/scripts/restore-test.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - database_backups:/backups:ro
    secrets:
      - control_restore_database_url
      - checkpoint_restore_database_url
    networks:
      control_net:

networks:
  data_net:
    driver: bridge
    internal: true

volumes:
  control_pgdata:
    name: tt_ai_control_pgdata
  checkpoint_pgdata:
    name: tt_ai_checkpoint_pgdata
  business_pgdata:
    name: tt_ai_business_pgdata
  database_backups:
    name: tt_ai_database_backups

secrets:
  control_owner_password:
    file: ../secrets/database/control_owner_password
  control_app_password:
    file: ../secrets/database/control_app_password
  control_migrator_password:
    file: ../secrets/database/control_migrator_password
  control_backup_password:
    file: ../secrets/database/control_backup_password
  checkpoint_owner_password:
    file: ../secrets/database/checkpoint_owner_password
  checkpoint_app_password:
    file: ../secrets/database/checkpoint_app_password
  checkpoint_migrator_password:
    file: ../secrets/database/checkpoint_migrator_password
  checkpoint_backup_password:
    file: ../secrets/database/checkpoint_backup_password
  business_owner_password:
    file: ../secrets/database/business_owner_password
  business_reader_password:
    file: ../secrets/database/business_reader_password
  control_migrator_database_url:
    file: ../secrets/database/control_migrator_database_url
  control_app_database_url:
    file: ../secrets/database/control_app_database_url
  checkpoint_migrator_database_url:
    file: ../secrets/database/checkpoint_migrator_database_url
  checkpoint_backup_database_url:
    file: ../secrets/database/checkpoint_backup_database_url
  checkpoint_restore_database_url:
    file: ../secrets/database/checkpoint_restore_database_url
  control_backup_database_url:
    file: ../secrets/database/control_backup_database_url
  control_restore_database_url:
    file: ../secrets/database/control_restore_database_url
