name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render Compose configuration
        run: |
          : > .env
          docker compose -f docker/docker-compose.yml config --no-interpolate > "${RUNNER_TEMP}/compose.yaml"
      - name: Scan worktree and rendered Compose configuration
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" zricethezav/gitleaks:v8.30.0 dir /repo --config /repo/.gitleaks.toml --redact=100
          docker run --rm -v "${RUNNER_TEMP}:/scan:ro" -v "$GITHUB_WORKSPACE/.gitleaks.toml:/config/gitleaks.toml:ro" zricethezav/gitleaks:v8.30.0 dir /scan --config /config/gitleaks.toml --redact=100
      - name: Verify the secret-scanning canary blocks
        run: |
          printf '%s\n' 'TT_AI_SECRET_CANARY_0123456789ABCDEF0123456789ABCDEF' > "${RUNNER_TEMP}/gitleaks-canary.txt"
          if docker run --rm -v "${RUNNER_TEMP}:/scan:ro" -v "$GITHUB_WORKSPACE/.gitleaks.toml:/config/gitleaks.toml:ro" zricethezav/gitleaks:v8.30.0 dir /scan --config /config/gitleaks.toml --redact=100; then
            echo "Expected Gitleaks to block the canary, but it succeeded."
            exit 1
          fi

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable candidate image
        run: >-
          docker build
          --build-arg VCS_REF="${{ github.sha }}"
          --build-arg VERSION="${{ github.ref_name }}-${{ github.sha }}"
          -f docker/Dockerfile
          -t tt-ai:${{ github.sha }}
          .
      - name: Scan image filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tt-ai:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: tt-ai:${{ github.sha }}
