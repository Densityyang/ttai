name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render Compose configuration
        run: |
          : > .env
          docker compose -f docker/compose.base.yml -f docker/compose.dev.yml -f docker/compose.test.yml config --no-interpolate > "${RUNNER_TEMP}/compose-test.yaml"
          docker compose -f docker/compose.base.yml -f docker/compose.prod.yml config --no-interpolate > "${RUNNER_TEMP}/compose-product.yaml"
      - name: Scan worktree and rendered Compose configuration
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" zricethezav/gitleaks:v8.30.0 dir /repo --config /repo/.gitleaks.toml --redact=100
          docker run --rm -v "${RUNNER_TEMP}:/scan:ro" -v "$GITHUB_WORKSPACE/.gitleaks.toml:/config/gitleaks.toml:ro" zricethezav/gitleaks:v8.30.0 dir /scan --config /config/gitleaks.toml --redact=100
      - name: Verify the secret-scanning canary blocks
        run: |
          printf '%s%s\n' 'TT_AI_SECRET_CANARY_' '0123456789ABCDEF0123456789ABCDEF' > "${RUNNER_TEMP}/gitleaks-canary.txt"
          if docker run --rm -v "${RUNNER_TEMP}:/scan:ro" -v "$GITHUB_WORKSPACE/.gitleaks.toml:/config/gitleaks.toml:ro" zricethezav/gitleaks:v8.30.0 dir /scan --config /config/gitleaks.toml --redact=100; then
            echo "Expected Gitleaks to block the canary, but it succeeded."
            exit 1
          fi

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable candidate image
        run: >-
          docker build
          --build-arg VCS_REF="${{ github.sha }}"
          --build-arg VERSION="${{ github.ref_name }}-${{ github.sha }}"
          -f docker/Dockerfile
          -t tt-ai:${{ github.sha }}
          .
      - name: Scan image filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tt-ai:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: tt-ai:${{ github.sha }}

  compose-contract:
    runs-on: ubuntu-latest
    env:
      TTAI_PORT: "18080"
      TT_API_BASE_URL: https://tt-api.invalid
      CORS_ALLOWED_ORIGINS: https://app.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose profiles
        run: |
          docker compose -f docker/compose.base.yml config --quiet
          docker compose -f docker/compose.base.yml -f docker/compose.dev.yml -f docker/compose.test.yml config --quiet
          docker compose -f docker/compose.base.yml -f docker/compose.prod.yml config --quiet
          docker compose -f docker/compose.release.yml config --no-interpolate --quiet
      - name: Validate Nginx configuration
        run: >-
          docker run --rm
          -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t
      - name: Start dual API test profile
        run: |
          docker compose -f docker/compose.base.yml -f docker/compose.dev.yml -f docker/compose.test.yml up -d --build api-a api-b nginx
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${TTAI_PORT}/healthz" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker/compose.base.yml -f docker/compose.dev.yml -f docker/compose.test.yml ps
          exit 1
      - name: Verify APIs have no host ports and Nginx fails over
        run: |
          if docker compose -f docker/compose.base.yml -f docker/compose.dev.yml -f docker/compose.test.yml port api-a 8000 2>/dev/null | grep -q .; then
            echo "api-a unexpectedly publishes a host port"
            exit 1
          fi
          docker compose -f docker/compose.base.yml -f docker/compose.dev.yml -f docker/compose.test.yml stop api-a
          for attempt in $(seq 1 15); do
            if curl --fail --silent "http://127.0.0.1:${TTAI_PORT}/healthz" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker/compose.base.yml -f docker/compose.dev.yml -f docker/compose.test.yml logs --no-color
      - name: Stop Compose profile
        if: always()
        run: docker compose -f docker/compose.base.yml -f docker/compose.dev.yml -f docker/compose.test.yml down --remove-orphans
