user nginx;
worker_processes auto;

events {}

http {
  log_format ttai_json escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time"}';

  access_log /var/log/nginx/access.log ttai_json;
  error_log /var/log/nginx/error.log warn;

  limit_req_zone $binary_remote_addr zone=queries:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;

  upstream ttai_api {
    least_conn;
    server api-a:8000 max_fails=2 fail_timeout=5s;
    server api-b:8000 max_fails=2 fail_timeout=5s;
    keepalive 32;
  }

  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Request-ID $request_id always;

    location = /healthz {
      proxy_pass http://ttai_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $request_id;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    location = /readyz {
      proxy_pass http://ttai_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $request_id;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    location /api/v2/ {
      limit_req zone=queries burst=20 nodelay;
      limit_conn connections 20;
      proxy_pass http://ttai_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trace-ID $request_id;
      proxy_set_header X-User-ID "";
      proxy_set_header X-Roles "";
      proxy_set_header X-Permissions "";
      proxy_set_header X-Auth-Epoch "";
      proxy_set_header X-Tenant-ID "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      add_header X-Accel-Buffering no always;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    location /nl2sql/ {
      limit_req zone=queries burst=20 nodelay;
      proxy_pass http://ttai_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-User-ID "";
      proxy_set_header X-Roles "";
      proxy_set_header X-Permissions "";
      proxy_set_header X-Tenant-ID "";
    }

    location / {
      return 404;
    }
  }
}
