events {}

http {
  limit_req_zone $binary_remote_addr zone=queries:10m rate=10r/s;

  upstream ttai_api {
    least_conn;
    server api-a:8000 max_fails=2 fail_timeout=5s;
    server api-b:8000 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
      proxy_pass http://ttai_api;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      limit_req zone=queries burst=20 nodelay;
      proxy_pass http://ttai_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trace-ID $request_id;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
